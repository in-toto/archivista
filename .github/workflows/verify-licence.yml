name: Verify License
on:
  workflow_dispatch:
  push:
    branches: ['main', 'release-*']
  pull_request:
permissions:
  contents: read

jobs:
    license-check:
      name: license boilerplate check
      runs-on: ubuntu-latest
      steps:
        - name: Harden Runner
          uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
          with:
            egress-policy: audit

        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
          with:
            go-version-file: "go.mod"
        - name: Install addlicense
          run: go install github.com/google/addlicense@v1.1.1
        - name: Check license headers
          run: |
            set -e
            addlicense --check -l apache -c 'The Archivista Contributors' \
              --ignore "generated.go" \
              --ignore "ent.resolvers.go" \
              --ignore "ent/migrate/migrations/**" \
              --ignore "docs/**" \
              --ignore "internal/credentialrefresh/**" \
              -v ./
